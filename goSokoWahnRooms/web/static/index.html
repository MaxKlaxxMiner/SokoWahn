<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>goSokoWahnRooms</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>goSokoWahnRooms</h1>
  <span id="title" class="dim">lade…</span>
  <span id="stats"></span>
</header>
<main>
  <section id="solverCol" hidden>
    <div class="listHead">-- Solver --</div>
    <div id="solverLog"></div>
    <div id="solverHint" class="dim"></div>
  </section>
  <section id="roomsCol">
    <div id="roomsList"></div>
  </section>
  <section id="midCol">
    <div id="statesHead" class="listHead">-- States --</div>
    <div id="statesList"></div>
    <div class="listHead">-- Variants --</div>
    <div id="variantsList"></div>
  </section>
  <section id="fieldCol">
    <div id="canvasWrap">
      <canvas id="field"></canvas>
    </div>
    <div id="info">Effort: …</div>
    <div id="hoverInfo" class="dim">&nbsp;</div>
  </section>
  <aside id="buttonsCol">
    <button id="mergeBtn" disabled title="gewählte Räume verschmelzen (mindestens 2 verbundene auswählen)">Merge Rooms</button>
    <button id="optimizeBtn" disabled title="Deadlock-Scan + Dominanzsuche auf den gewählten Räumen (entbehrliche Varianten entfernen)">Optimize</button>
    <button id="stopBtn" disabled title="laufende Rechnung abbrechen (bereits Bewiesenes bleibt angewandt)">Stop</button>
    <input id="maxMoves" type="number" min="1" placeholder="max moves" title="verifizierte obere Schranke der Gesamtlösung (z.B. Länge einer bekannten Lösung) - der Optimizer kappt Nutzungen über dem Budget; ACHTUNG: ein zu kleiner Wert wirft die Optimallösung weg">
    <button disabled title="folgt später">Filter</button>
    <button id="validateBtn" title="Konsistenz des Netzwerks prüfen">Validate</button>
    <button id="solveBtn" title="Level per Brute-Force auf dem Rooms-Netzwerk lösen (Vorwärtssuche über die Varianten; max moves wirkt als hartes Budget). Steuerung wie in brute: b = Bulk-Schritte, a = Auto an/aus, +/- = Bulkgröße; die Lösung ist danach per Pfeiltasten durchsteppbar">Solve</button>
    <button id="snapSaveBtn" title="aktuellen Netzwerk-Stand als Snapshot speichern (temp/room-snapshots)">Speichern</button>
    <button id="snapLoadBtn" disabled title="gewählten Snapshot laden (ersetzt das aktuelle Netzwerk)">Laden</button>
    <button id="snapDeleteBtn" disabled title="gewählten Snapshot löschen">Löschen</button>
    <div id="snapList" title="Snapshots dieses Levels: Effort und Dateigröße"></div>
  </aside>
</main>
<div id="error" hidden></div>
<script src="/app.js"></script>
</body>
</html>
